<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070709" />
  <title>Packet — The gap</title>
  <style>
    :root { color-scheme: dark; --bg:#070709; --card:#14141a; --line:rgba(255,255,255,.08); --text:#f4f4f6; --muted:#9a9aa6; --dim:#6c6c78; --mint:#5eead4; --gold:#f5d07a; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px); font-family:"SF Pro Display",Inter,system-ui,-apple-system,sans-serif; }
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100dvh;color:var(--text);background:radial-gradient(900px 420px at 10% -10%,rgba(94,234,212,.12),transparent 50%),var(--bg)}
    .app{max-width:430px;margin:0 auto;min-height:100dvh;padding:calc(16px + var(--safe-t)) 16px calc(28px + var(--safe-b))}
    .kicker{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mint);font-weight:700}
    h1{font-size:1.65rem;letter-spacing:-.04em;margin:8px 0 6px}
    .lead{color:var(--muted);font-size:.92rem;line-height:1.45;margin-bottom:18px}
    label{display:block;font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:12px 0 6px}
    input,select{width:100%;background:#101014;border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--text);font:inherit}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .btn{width:100%;height:50px;border:0;border-radius:16px;font:inherit;font-weight:700;margin-top:16px}
    .btn-main{background:linear-gradient(180deg,#5eead4,#2dd4bf);color:#042f2e}
    .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted);margin-top:10px}
    .clock{border-radius:22px;padding:18px;background:linear-gradient(165deg,#18242c,#101014);border:1px solid rgba(94,234,212,.2);margin-bottom:14px}
    .clock em{font-style:normal;font-size:2.2rem;letter-spacing:-.05em;display:block;margin:6px 0 4px}
    .path{display:flex;flex-direction:column;gap:10px}
    .card{text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;color:inherit;text-decoration:none;display:block}
    .card .step{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
    .card h3{font-size:1.02rem;margin:6px 0 4px}
    .card p{color:var(--muted);font-size:.82rem}
    .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:.76rem;color:var(--dim)}
    .price{color:var(--mint);font-weight:700}
    .pill{display:inline-block;margin-top:8px;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
    .hint{margin-top:14px;color:var(--dim);font-size:.78rem;line-height:1.4}
  </style>
</head>
<body>
<div class="app" id="app"></div>
<script>
function keys(){ try { return JSON.parse(localStorage.getItem('packet-keys') || '{}'); } catch(e){ return {}; } }
function saveKeys(k){ localStorage.setItem('packet-keys', JSON.stringify(k)); }
function bounce(code){ const id = keys().bounce || 'packet'; return 'https://www.bounce.com/luggagestorage/' + code.toLowerCase() + '?ref=' + encodeURIComponent(id); }
function hotels(q){ const id = keys().hotels || 'packet'; return 'https://www.hotels.com/Hotel-Search?destination=' + encodeURIComponent(q) + '&ref=' + encodeURIComponent(id); }
function maps(q){ return 'https://maps.apple.com/?q=' + encodeURIComponent(q); }
const PLACES = {
  MIA:{ name:'Miami (MIA)', terminals:['D','E','F','G','H','J'], guess:{AA:'D',B6:'C',DL:'H',UA:'J'},
    bags:t=>[{title:'Bounce locker \u00b7 T'+t,mins:t==='D'?8:12,price:'$8+',note:'Drop before you leave the terminal.',url:bounce('MIA')}],
    shower:t=>[{title:'Lounge shower \u00b7 T'+t,mins:15,price:'Day pass',note:'Fastest wash after a redeye.',url:'https://www.miami-airport.com'},{title:'Day room near MIA',mins:20,price:'$60-90',note:'Sleep + shower on a long gap.',url:hotels('Miami International Airport')}],
    sit:t=>[{title:'Quiet gate \u00b7 T'+t,mins:5,price:'Free',note:'Stay airside if you are wrecked.',url:maps('Miami airport terminal '+t)},{title:'Coral Gables cafe',mins:25,price:'$',note:'Only after bags are stashed.',url:maps('Coral Gables cafes')}] },
  MCO:{ name:'Orlando (MCO)', terminals:['A','B','C'], guess:{WN:'A',B6:'C',F9:'C',NK:'A'},
    bags:t=>[{title:'Luggage storage \u00b7 T'+t,mins:10,price:'$7+',note:'Do not take bags off-airport for a short gap.',url:bounce('MCO')}],
    shower:t=>[{title:'Lounge shower \u00b7 T'+t,mins:14,price:'Day pass',note:'Stay on grounds.',url:'https://www.orlandoairports.net'},{title:'Airport day room',mins:10,price:'$60-90',note:'Better than a chair.',url:hotels('Orlando International Airport')}],
    sit:t=>[{title:'Hyatt Regency lobby',mins:8,price:'Free',note:'AC, outlets, bathrooms.',url:maps('Hyatt Regency Orlando Airport')},{title:'Airport hotel day room',mins:10,price:'$60-90',note:'Long gap: pay to sleep.',url:hotels('Orlando International Airport')}] },
  JFK:{ name:'New York (JFK)', terminals:['1','4','5','7','8'], guess:{AA:'8',B6:'5',DL:'4',BA:'7',VS:'4'},
    bags:t=>[{title:'Locker / Bounce \u00b7 T'+t,mins:12,price:'$10+',note:'Do not haul bags into the city on a short gap.',url:bounce('JFK')}],
    shower:t=>[{title:(t==='5'||t==='4')?'TWA Hotel shower':'Lounge shower \u00b7 T'+t,mins:12,price:'$',note:t==='5'?'Next to T5.':'Closest wash to this terminal.',url:'https://www.twahotel.com'},{title:'TWA Hotel day room',mins:12,price:'$',note:'The JFK long-gap move.',url:'https://www.twahotel.com'}],
    sit:t=>[{title:'TWA lobby',mins:12,price:'Free',note:'Best sit on the property.',url:'https://www.twahotel.com'},{title:'TWA day room',mins:12,price:'$',note:'Sleep instead of Manhattan.',url:'https://www.twahotel.com'}] },
  ATL:{ name:'Atlanta (ATL)', terminals:['T','A','B','C','D','E','F'], guess:{DL:'F',WN:'C',AA:'T',UA:'T'},
    bags:t=>[{title:'Storage \u00b7 T'+t,mins:10,price:'$8+',note:'Plane train first, then drop.',url:bounce('ATL')}],
    shower:t=>[{title:'Club shower',mins:16,price:'Day pass',note:'ATL is built for this.',url:'https://www.atl.com'},{title:'Airport hotel day room',mins:15,price:'$70+',note:'Long connection or early land.',url:hotels('Hartsfield-Jackson Atlanta')}],
    sit:t=>[{title:'Atrium / gate \u00b7 T'+t,mins:6,price:'Free',note:'Food and outlets in the center.',url:maps('ATL airport atrium')},{title:'Airport hotel',mins:15,price:'$',note:'Leave the concourse if you have 6h+.',url:hotels('Hartsfield-Jackson Atlanta')}] },
  LAX:{ name:'Los Angeles (LAX)', terminals:['1','2','3','4','5','6','7','8','B'], guess:{WN:'1',DL:'3',AA:'4',UA:'7',AS:'6',B6:'5'},
    bags:t=>[{title:'Bounce / locker \u00b7 T'+t,mins:14,price:'$10+',note:'LAX walks are long. Drop first.',url:bounce('LAX')}],
    shower:t=>[{title:'Lounge shower \u00b7 T'+t,mins:18,price:'Day pass',note:'Do not go to Santa Monica for a 3h gap.',url:'https://www.flylax.com'},{title:'Airport day room',mins:15,price:'$80+',note:'Long gap only.',url:hotels('LAX airport hotel')}],
    sit:t=>[{title:'Terminal sit \u00b7 T'+t,mins:6,price:'Free',note:'Stay put under 3 hours.',url:maps('LAX terminal '+t)},{title:'Airport hotel lobby',mins:12,price:'Free',note:'After bags are gone.',url:hotels('LAX airport hotel')}] },
  ORD:{ name:'Chicago (ORD)', terminals:['1','2','3','5'], guess:{UA:'1',AA:'3',F9:'5',NK:'5',B6:'5'},
    bags:t=>[{title:'Storage \u00b7 T'+t,mins:11,price:'$9+',note:'T5 is a hike from 1-3.',url:bounce('ORD')}],
    shower:t=>[{title:'Club shower \u00b7 T'+t,mins:14,price:'Day pass',note:'United T1 / American T3.',url:'https://www.flychicago.com'},{title:'Hilton / airport day room',mins:12,price:'$70+',note:'Attached hotels help here.',url:hotels('OHare airport hotel')}],
    sit:t=>[{title:'Gate sit \u00b7 T'+t,mins:5,price:'Free',note:'Fine for a short gap.',url:maps('ORD terminal '+t)},{title:'Hilton ORD',mins:12,price:'$',note:'Long gap: leave the sterile area.',url:hotels('Hilton Chicago OHare')}] },
  DFW:{ name:'Dallas (DFW)', terminals:['A','B','C','D','E'], guess:{AA:'A',DL:'E',UA:'E',WN:'E'},
    bags:t=>[{title:'Storage \u00b7 T'+t,mins:10,price:'$8+',note:'Skylink between terminals.',url:bounce('DFW')}],
    shower:t=>[{title:'Admirals / lounge shower',mins:14,price:'Day pass',note:'AA owns this airport.',url:'https://www.dfwairport.com'},{title:'Grand Hyatt DFW day room',mins:8,price:'$',note:'Inside Terminal D.',url:hotels('Grand Hyatt DFW')}],
    sit:t=>[{title:'Gate sit \u00b7 T'+t,mins:5,price:'Free',note:'Short gap: do not Skylink around.',url:maps('DFW terminal '+t)},{title:'Grand Hyatt lobby',mins:8,price:'Free',note:'Terminal D. Worth it if you have hours.',url:maps('Grand Hyatt DFW')}] }
};
const state = { step:'setup', airport:'MIA', terminal:'D', flight:'', land:defaultLand(), checkin:defaultCheckin(), toast:'', looking:false };
function defaultLand(){ const d=new Date(); d.setMinutes(0,0,0); return toLocal(d); }
function defaultCheckin(){ const d=new Date(); d.setHours(15,0,0,0); if(d<new Date()) d.setDate(d.getDate()+1); return toLocal(d); }
function toLocal(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }
function esc(s){ return String(s||'').replace(/&/g,'&').replace(/</g,'<').replace(/"/g,'"'); }
function airlineCode(flight){ const m=String(flight||'').toUpperCase().replace(/\s+/g,'').match(/^([A-Z]{2})/); return m?m[1]:''; }
function guessTerminal(code, flight){ const place=PLACES[code]; const al=airlineCode(flight); if(al && place.guess[al]) return place.guess[al]; return place.terminals[0]; }
function flightIata(flight){ const m=String(flight||'').toUpperCase().replace(/\s+/g,'').match(/^([A-Z]{2})(\d{1,4})$/); return m?m[1]+m[2]:''; }
function toLocalFromIso(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return toLocal(d); }
function jsonp(url){
  return new Promise(function(resolve, reject){
    const cb='pkt'+Date.now();
    const t=setTimeout(function(){ cleanup(); reject(new Error('timeout')); }, 12000);
    function cleanup(){ clearTimeout(t); try{ delete window[cb]; }catch(e){} if(script.parentNode) script.parentNode.removeChild(script); }
    window[cb]=function(data){ cleanup(); resolve(data); };
    const script=document.createElement('script');
    script.src=url+(url.indexOf('?')>=0?'&':'?')+'callback='+cb;
    script.onerror=function(){ cleanup(); reject(new Error('network')); };
    document.body.appendChild(script);
  });
}
function applyFlight(row){
  if(!row) return 'No flight found';
  const arr=row.arrival||{};
  const iata=(arr.iata||'').toUpperCase();
  if(iata && PLACES[iata]){
    state.airport=iata;
    if(arr.terminal && PLACES[iata].terminals.indexOf(String(arr.terminal))>=0) state.terminal=String(arr.terminal);
    else state.terminal=guessTerminal(iata, state.flight);
  } else if(arr.terminal) state.terminal=String(arr.terminal);
  const local=toLocalFromIso(arr.estimated||arr.actual||arr.scheduled);
  if(local) state.land=local;
  const bits=[];
  if(iata) bits.push(iata);
  if(arr.terminal) bits.push('T'+arr.terminal);
  if(arr.delay) bits.push(arr.delay+'m late');
  return bits.length ? 'Updated from flight \u00b7 '+bits.join(' \u00b7 ') : 'Flight found, little arrival data';
}
async function lookupFlight(){
  readSetup();
  const iata=flightIata(state.flight);
  const key=keys().aviationstack;
  if(!iata){ state.toast='Enter a flight like AA 1420'; render(); return; }
  if(!key){ state.toast='Add a free Aviationstack key in Settings'; state.step='settings'; render(); return; }
  state.looking=true; state.toast='Looking up '+iata+'\u2026'; render();
  try {
    const url='https://api.aviationstack.com/v1/flights?access_key='+encodeURIComponent(key)+'&flight_iata='+encodeURIComponent(iata);
    const data=await jsonp(url);
    if(data && data.error) throw new Error(data.error.message||'API error');
    const row=(data && (data.data||data.results)||[])[0];
    state.toast=applyFlight(row);
  } catch(e) {
    state.toast='Lookup failed. Key or CORS. Terminal guess still works.';
    state.terminal=guessTerminal(state.airport, state.flight);
  }
  state.looking=false; render();
}
function remaining(){ const a=Date.parse(state.land), b=Date.parse(state.checkin); if(isNaN(a)||isNaN(b)) return null; return b-Math.max(Date.now(),a); }
function fmt(ms){ if(ms==null) return '\u2014'; if(ms<=0) return 'You can check in now'; return Math.floor(ms/3600000)+'h '+Math.floor((ms%3600000)/60000)+'m'; }
function hoursLeft(ms){ return (ms||0)/3600000; }
function buildPath(place, term, ms){
  const bags=place.bags(term), shower=place.shower(term), sit=place.sit(term), h=hoursLeft(ms);
  if(ms!=null && ms<=0) return {line:'Check-in is open. Go to the hotel.', items:[{step:'Now',title:'Go check in',note:'The gap is over.',mins:0,price:'',url:''}]};
  if(h<2.5) return {line:'Short gap. Stay in T'+term+'. Do not leave with bags.', items:[{step:'1 \u00b7 Stay',title:'Keep the bags',note:'Not enough time for a locker round-trip.',mins:0,price:'Free',url:''}, Object.assign({step:'2 \u00b7 Sit'}, sit[0])]};
  if(h<5.5) return {line:'T'+term+' \u00b7 bags, then a shower, then sit.', items:[Object.assign({step:'1 \u00b7 Bags'}, bags[0]), Object.assign({step:'2 \u00b7 Shower'}, shower[0]), Object.assign({step:'3 \u00b7 Sit'}, sit[0])]};
  return {line:'Long gap out of T'+term+'. Day room beats a gate chair.', items:[Object.assign({step:'1 \u00b7 Bags'}, bags[0]), Object.assign({step:'2 \u00b7 Reset'}, shower[1]||shower[0]), Object.assign({step:'3 \u00b7 Sit'}, sit[1]||sit[0])]};
}
function card(item){ const inner='<div class="step">'+esc(item.step)+'</div><h3>'+esc(item.title)+'</h3><p>'+esc(item.note)+'</p><div class="meta"><span>'+(item.mins||0)+' min</span><span class="price">'+esc(item.price)+'</span></div>'+(item.url?'<div class="pill">Book via Packet</div>':''); return item.url?'<a class="card" href="'+esc(item.url)+'" target="_blank" rel="noopener">'+inner+'</a>':'<div class="card">'+inner+'</div>'; }
function termOptions(){ return PLACES[state.airport].terminals.map(t=>'<option value="'+t+'"'+(state.terminal===t?' selected':'')+'>Terminal '+t+'</option>').join(''); }
function toastHtml(){ return state.toast ? '<p class="hint" style="color:var(--gold)">'+esc(state.toast)+'</p>' : ''; }
function renderSetup(){ const opts=Object.keys(PLACES).map(k=>'<option value="'+k+'"'+(state.airport===k?' selected':'')+'>'+PLACES[k].name+'</option>').join(''); return '<div class="kicker">Packet</div><h1>The hours nobody booked.</h1><p class="lead">Flight lookup fills landing time and terminal when you add a key.</p><label>Airport</label><select id="airport">'+opts+'</select><label>Flight</label><input id="flight" placeholder="AA 1420" value="'+esc(state.flight)+'"><button class="btn btn-ghost" id="lookup" style="margin-top:8px">'+(state.looking?'Looking\u2026':'Lookup flight')+'</button><label>Terminal</label><select id="terminal">'+termOptions()+'</select><div class="row"><div><label>Landed</label><input id="land" type="datetime-local" value="'+esc(state.land)+'"></div><div><label>Hotel check-in</label><input id="checkin" type="datetime-local" value="'+esc(state.checkin)+'"></div></div>'+toastHtml()+'<button class="btn btn-main" id="go">Show my gap</button><button class="btn btn-ghost" id="settings">API keys</button><p class="hint">Bounce and Hotels have no public stock API. Your affiliate IDs go on the book links.</p>'; }
function renderSettings(){ const k=keys(); return '<div class="kicker">Packet</div><h1>Keys</h1><p class="lead">Free Aviationstack key fills landing time. Affiliate IDs make locker/hotel taps pay you.</p><label>Aviationstack key</label><input id="k-air" value="'+esc(k.aviationstack||'')+'" placeholder="from aviationstack.com"><label>Bounce ref</label><input id="k-bounce" value="'+esc(k.bounce||'')+'" placeholder="packet"><label>Hotels ref</label><input id="k-hotels" value="'+esc(k.hotels||'')+'" placeholder="packet">'+toastHtml()+'<button class="btn btn-main" id="save-keys">Save</button><button class="btn btn-ghost" id="back">Back</button><p class="hint">500 free lookups/month at aviationstack.com. Bounce/Hotels partner programs give you the ref IDs.</p>'; }
function renderGap(){ const place=PLACES[state.airport], ms=remaining(), path=buildPath(place,state.terminal,ms), flight=state.flight?' \u00b7 '+state.flight.toUpperCase():''; return '<div class="kicker">'+esc(place.name)+' \u00b7 T'+esc(state.terminal)+esc(flight)+'</div><div class="clock"><div class="kicker">Until check-in</div><em>'+esc(fmt(ms))+'</em><p class="lead" style="margin:0">'+esc(path.line)+'</p></div><div class="path">'+path.items.map(card).join('')+'</div><button class="btn btn-ghost" id="back">Change details</button><p class="hint">Packet earns if you book a locker or room.</p>'; }
function readSetup(){ const a=document.getElementById('airport'), f=document.getElementById('flight'), t=document.getElementById('terminal'), l=document.getElementById('land'), c=document.getElementById('checkin'); if(a) state.airport=a.value; if(f) state.flight=f.value; if(t) state.terminal=t.value; if(l) state.land=l.value; if(c) state.checkin=c.value; }
function render(){ document.getElementById('app').innerHTML = state.step==='gap' ? renderGap() : state.step==='settings' ? renderSettings() : renderSetup(); }
document.getElementById('app').addEventListener('change', function(e){
  if(e.target.id==='airport'){ readSetup(); state.terminal=guessTerminal(state.airport,state.flight); render(); }
  if(e.target.id==='flight'){ readSetup(); const g=guessTerminal(state.airport,state.flight); if(g){ state.terminal=g; render(); } }
});
document.getElementById('app').addEventListener('click', function(e){
  if(e.target.id==='go'){ readSetup(); state.step='gap'; render(); }
  if(e.target.id==='back'){ state.step='setup'; render(); }
  if(e.target.id==='settings'){ state.step='settings'; render(); }
  if(e.target.id==='lookup'){ if(!state.looking) lookupFlight(); }
  if(e.target.id==='save-keys'){
    saveKeys({ aviationstack:(document.getElementById('k-air')||{}).value||'', bounce:(document.getElementById('k-bounce')||{}).value||'', hotels:(document.getElementById('k-hotels')||{}).value||'' });
    state.toast='Saved on this phone'; state.step='setup'; render();
  }
});
render();
</script>
</body>
</html>
